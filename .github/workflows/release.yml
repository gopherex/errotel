name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  prepare:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: yarn
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: services/errotel/go.mod
          cache-dependency-path: services/errotel/go.sum
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node scripts/release-version.mjs check "$TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: yarn install --frozen-lockfile
      - run: make release-artifacts VERSION="$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: Smoke test the extracted Linux archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/test-release-archive.mjs
      - name: Test the exact npm tarballs before publishing
        run: node scripts/test-packages.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error
  docker:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/errotel/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/gopherex/errotel:${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/gopherex/errotel
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
  packages:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: [sdk, api]
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          registry-url: https://npm.pkg.github.com
          scope: '@gopherex'
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist/release
      - name: Publish tested tarball to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PACKAGE: ${{ matrix.package }}
        run: |
          archive="$(realpath "dist/release/errotel-${PACKAGE}-${VERSION}.tgz")"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          tar -xzf "$archive" -C "$stage"
          cd "$stage/package"
          # Yarn 1 reads metadata from cwd, even when publishing a tarball.
          yarn publish "$archive" --new-version "$VERSION" --non-interactive --no-git-tag-version --registry https://npm.pkg.github.com
  release:
    needs: [prepare, docker, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist/release
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote image and create release with downloadable assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          docker buildx imagetools create --tag ghcr.io/gopherex/errotel:latest "ghcr.io/gopherex/errotel:${VERSION}"
          gh release create "$TAG" dist/release/* --verify-tag --generate-notes --title "$TAG"
